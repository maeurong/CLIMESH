name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verifica:
    name: format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `-p climesh` e non `--all`: --all segue la dipendenza di percorso ed entra
      # in vendor/solweig, che e' codice di altri e non e' nostro da formattare.
      # Riformattarlo renderebbe irriconciliabile il prossimo aggiornamento.
      - name: Formatting
        run: cargo fmt -p climesh --check

      - name: Lint
        run: cargo clippy --all-targets --all-features

      # The reference case lives in `materiale università/`, which is not
      # redistributable and therefore not in the repository. The handful of tests
      # that need the real file carry `#[ignore]` and are reported as ignored
      # here — never as passed. Everything else, the synthetic models included,
      # runs for real.
      - name: Tests
        run: cargo test --all-features -- --nocapture

      # Where the material is on disk — a developer machine, not this runner —
      # the same suite runs the ignored checks too:
      #   cargo test -- --include-ignored
