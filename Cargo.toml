[package]
name = "climesh"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
readme = "README.md"
description = "Simulazione del microclima urbano per il comfort termico all'aperto"
repository = "https://github.com/maeurong/CLIMESH"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ndarray = "0.16"
# Gia' nell'albero via ndarray: diretta perche' il Motore nomina il suo pool.
rayon = "1"
solweig-ombre = { path = "vendor/solweig" }
