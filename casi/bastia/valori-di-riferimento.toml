interventi = 5.30
unita = "°C"

# Velocità del vento: la relazione pubblica la differenza massima introdotta
# dagli interventi, non i due valori assoluti. Segno negativo: gli interventi
# rallentano il vento.
[[vento]]
periodo = "estate"
giorno = 2021-07-15
ora = "06:00"
differenza_massima = -0.10
unita = "m/s"

[[vento]]
periodo = "estate"
giorno = 2021-07-15
ora = "15:00"
differenza_massima = -0.12
unita = "m/s"

[[vento]]
periodo = "inverno"
giorno = 2021-01-15
ora = "06:00"
differenza_massima = -0.05
unita = "m/s"

[[vento]]
periodo = "inverno"
giorno = 2021-01-15
ora = "16:00"
differenza_massima = -0.07
unita = "m/s"

[note]
ambiguita = [
  "Non è detto su quale estensione siano presi i massimi e i minimi: se sull'intera griglia, sui soli tre punti di osservazione, o su una sezione. I valori qui restano come pubblicati.",
  "D'estate la relazione riporta solo i massimi, d'inverno massimi e minimi. La mancanza è della fonte, non della trascrizione.",
  "L'ora del pomeriggio cambia con la stagione: 15:00 d'estate, 16:00 d'inverno. Presumibilmente l'ora del massimo, ma la relazione non lo dice.",
  "Non è detta la quota a cui sono presi i valori. ENVI-met riporta di norma il primo livello utile sopra il suolo; senza il file di configurazione della simulazione non è verificabile.",
  "Le corse durano 48 ore a partire dal giorno indicato: non è detto se le ore riportate appartengano al primo o al secondo giorno simulato.",
  "D'inverno gli interventi alzano il massimo (+1,11 °C alle 06:00) e abbassano il minimo (−0,16 °C alle 06:00): i due effetti hanno segno opposto, ed è così che la relazione li riporta.",
]

[verifica_scenario]
scenario_contenuto_in_lab1 = "stato di fatto"
nota = """
Verificato leggendo LAB1.INX, non dedotto dal nome del file. Tre indizi
concordi, e nessuno contrario:

1. La matrice ID_soilprofile vale 000000 in tutte e 2500 le celle: nessuna
   superficie d'acqua, e l'acqua (WW) è un intervento.
2. Nessuna delle 616 istanze di vegetazione è radicata su una cella con
   zTop > 0: sopra i duplex non c'è niente, e la vegetazione sopra i duplex è
   un intervento.
3. Nessun plantID del file finisce per H2 o H4, che sono i codici delle siepi
   introdotte dagli interventi.

Le cinque specie presenti sono: 020027 .Pine Tree (middle), 309 istanze;
020060 .London Plane Tree (middle), 168; 0000PR .Tilia, 62; 0000PA
.Populus Alba, 61; 020111 .Hanging Birch (middle), 16. Più l'erba 0100XX
nella matrice ID_plants1D, presente in 1602 celle su 2500.
"""
per_avere_l_altro_scenario = """
Manca il file .INX degli interventi, che nel materiale del corso non c'è: non
è ricostruibile dallo stato di fatto senza sapere dove vadano messe le siepi e
lo specchio d'acqua. Servirebbero, in ordine di quanto pesano:

1. la posizione in griglia della vegetazione H2 di confine e sopra i duplex e
   della H4 addossata agli edifici, e la loro specie;
2. l'estensione in griglia della superficie d'acqua WW e il profilo di suolo
   con cui è stata realizzata;
3. la conferma che nient'altro cambi fra i due scenari — edifici, terreno e
   griglia.

Finché non ci sono, il caso versionato copre un solo Scenario dei due, e il
confronto fra scenari resta sui numeri pubblicati nella relazione.
"""

[incongruenze]
trovate = [
  "locationName dice 'bergamo' ma le coordinate del file sono lat 43.07 lon 12.56, cioè l'Umbria, e il caso è a Bastia Umbra. Il nome è un refuso lasciato da un modello precedente: le coordinate sono quelle giuste, il nome no.",
  "La relazione elenca per lo stato di fatto quattro codici di vegetazione (XX, 11, 27, PA), ma LAB1.INX contiene cinque specie: oltre a 020027 (27) e 020111 (11) e 0000PA (PA), ci sono 020060 .London Plane Tree con 168 istanze e 0000PR .Tilia con 62. Sono un terzo delle piante del modello e la relazione non le nomina.",
  "Il codice 'PA' della relazione corrisponde a plantID 0000PA (.Populus Alba), che nel file sta nell'angolo a i alti e j alti, cioè in alto a destra guardando il modello con il nord in alto: coerente con la descrizione. Ma i codici della relazione sono le ultime due cifre del plantID a sei caratteri, e questa corrispondenza non è dichiarata da nessuna parte.",
  "buildingNr spezza i tre blocchi costruiti in sette identificativi, alcuni dei quali coprono una sola cella. Chi conta gli edifici per numero ne conta sette invece di tre.",
  "In ID_plants1D l'erba manca sotto tutti gli edifici e sotto 618 celle, mentre le istanze di vegetazione sono 616: due celle vuote non hanno né edificio né albero. Sono due sviste del disegno, non del formato.",
  "L'EPW è della stazione di Perugia (lat 43.08, lon 12.50) mentre il modello è a Bastia Umbra (lat 43.07, lon 12.56). La relazione non discute la distanza.",
  "Il file .INX non contiene i parametri della simulazione: giorni, durata, forcing e direzione del vento stanno solo nella relazione e nel file di configurazione .SIMX, che nel materiale del corso non c'è.",
