# Caso di riferimento CLIMESH: Casa Evolutiva, Bastia Umbra (PG).
# Valori pubblicati nella relazione del caso studio, trascritti a mano perché
# possano essere confrontati da un programma. TOML e non JSON per una ragione
# sola: qui servono le note, e TOML ha i commenti.
#
# Questo file è scritto a mano. L'estratto del modello, invece, è generato:
# vedi scenario-lab1.toml e docs/formato-inx.md.

[provenienza]
relazione = "materiale università/RELAZIONI/LA01.pdf, pagine 2-6"
trascritto_da = "estrazione del testo del PDF, riletta e dettata durante la sessione di pianificazione"
trascritto_il = 2026-08-31
nota = """
Nell'ambiente di lavoro non c'è un estrattore di PDF: i valori sono stati letti
e dettati a mano. Ogni numero qui sotto porta l'ora e lo scenario a cui
appartiene; dove la relazione è ambigua c'è una nota invece di una congettura.
"""

[ingressi]
modello = "materiale università/LAB1.INX"
modello_sha256 = "8bc18f929694939e8759b854e00b42ac5fa4ba8ad64ce4b5f5e3f5ab283b0ec2"
modello_estratto = "casi/bastia/scenario-lab1.toml"
meteo = "materiale università/ITA_Perugia.161810_IGDG.epw"
meteo_sha256 = "45d3fd76d7b4748b3c2506c637b2aa67f8cfb12308491f5c91f1d5e31361d4e1"
meteo_stazione = "Perugia, ITA, IGDG, WMO 161810, lat 43.08, lon 12.50, fuso +1.0, quota 213 m"
meteo_righe_dati = 8760
nota = """
Le somme di controllo sono state calcolate con sha256sum sui file di
`materiale università/`, che resta fuori dal repository perché non
redistribuibile. Servono a dire se il file letto è ancora quello di allora.
La stazione dell'EPW è Perugia; il modello è a Bastia Umbra, una ventina di
chilometri più a est. La relazione non discute la differenza.
"""

# I tre punti in cui la relazione riporta le serie temporali, in coordinate di
# griglia (i;j). Convenzione degli indici: vedi docs/formato-inx.md.
[[punti_di_osservazione]]
id = 1
i = 15
j = 18

[[punti_di_osservazione]]
id = 2
i = 25
j = 35

[[punti_di_osservazione]]
id = 3
i = 37
j = 15

[[scenari]]
nome = "stato di fatto"
descrizione = "il luogo come si trova, senza interventi"
vegetazione_codici_envimet = ["XX", "11", "27", "PA"]
vegetazione_note = "XX erba, 11 albero centrale, 27 alberi circostanti, PA alberi in alto a destra"

[[scenari]]
nome = "interventi"
descrizione = "stato di fatto più le mitigazioni proposte"
vegetazione_codici_envimet = ["XX", "11", "27", "PA", "H2", "H4", "WW"]
vegetazione_note = """
Gli stessi dello stato di fatto, più H2 vegetazione di confine e sopra i
duplex, H4 vegetazione addossata agli edifici, WW acqua.
"""

[[periodi]]
nome = "estate"
giorno = 2021-07-15
durata_ore = 48
forcing = "simple forcing"
direzione_vento_gradi = 45

[[periodi]]
nome = "inverno"
giorno = 2021-01-15
durata_ore = 48
forcing = "simple forcing"
direzione_vento_gradi = 180

[edifici]
duplex_altezza_m = 6.0
duplex_blocchi = 2
simplex_altezza_m = 3.0
simplex_blocchi = 1
nota = """
Le altezze coincidono con i valori di zTop letti in LAB1.INX: 6 m per i due
blocchi maggiori, 3 m per quello minore, 0 altrove.
"""

# Temperatura dell'aria. Ogni riga porta il periodo, la grandezza, l'ora, e i
# due scenari nell'ordine in cui la relazione li accosta.
[[temperatura_aria]]
periodo = "estate"
giorno = 2021-07-15
grandezza = "massima"
ora = "06:00"
stato_di_fatto = 19.44
interventi = 19.50
unita = "°C"

[[temperatura_aria]]
periodo = "estate"
giorno = 2021-07-15
grandezza = "massima"
ora = "15:00"
stato_di_fatto = 28.18
interventi = 27.97
unita = "°C"

[[temperatura_aria]]
periodo = "inverno"
giorno = 2021-01-15
grandezza = "massima"
ora = "06:00"
stato_di_fatto = 3.13
interventi = 4.24
unita = "°C"

[[temperatura_aria]]
