# Manifesto della copia vendorata: solo cio' che di UMEP-dev/solweig serve a
# CLIMESH, elencato in PROVENIENZA.toml. Il manifesto a monte dichiara pyo3,
# numpy, wgpu e rayon; qui resta ndarray, alla stessa versione minore, perche'
# due minori diverse sono due tipi diversi e ArrayView2<f32> non combacerebbe.
[package]
name = "solweig-vendorato"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "La parte di UMEP-dev/solweig che CLIMESH riusa, vendorata. Vedi PROVENIENZA.toml."
publish = false

[dependencies]
ndarray = { version = "0.16.1", features = ["rayon"] }
# `utci.rs` importa rayon in cima al file, e l'import resta anche quando
# l'unica funzione che lo usava e' un involucro Python che l'estrazione toglie.
# Si dichiara la dipendenza invece di cancellare la riga: rayon e' gia' nel
# grafo per la feature di ndarray, quindi non entra niente di nuovo nel
# binario, e il sorgente rimasto resta identico a quello di monte.
rayon = "1"

# Nessuna feature "gpu": il percorso GPU resta nel sorgente dietro il suo
# #[cfg] e si compila fuori da se'.
[features]
default = []

# Workspace a se': la copia vendorata non e' un membro del nostro, cosi' i suoi
# avvisi non rompono `clippy -D warnings` in CI. Il codice di altri non si
# corregge per far passare i nostri cancelli: si isola.
[workspace]
